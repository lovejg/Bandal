# 서버의 /srv/bandal에 놓이는 Bandal 묶음. 구조는 DESIGN.md 6번 "배포 구조"
# 먼저: docker network create edge  (바깥 Nginx와 같이 쓰는 네트워크. 없으면 이 파일이 뜨지 않는다)
#       docker network create monitoring  (Prometheus가 backend를 긁는 네트워크. 서버에서는 deploy.sh가 만든다)
#       docker network create --internal stats-db  (Grafana가 통계 표를 읽는 네트워크. 서버에서는 deploy.sh가 만든다)
# 비밀값은 같은 폴더의 .env에서 읽는다(.env.example 참고, git에 올리지 않는다)
# 서버에서는 배포 작업이 이 파일과 deploy.sh, .env를 올리고 ./deploy.sh <커밋 SHA>로 띄운다
# 로컬에서 직접 만들어 띄울 때: docker compose up -d --build
name: bandal

# backend와 worker가 같이 쓰는 환경 변수. 같은 앱(같은 이미지)이라 비밀값도 같다
# x-로 시작하는 칸은 Compose가 서비스로 읽지 않는다. &이름으로 붙이고 <<: *이름으로 가져다 쓴다
x-backend-env: &backend-env
  SPRING_PROFILES_ACTIVE: prod
  DB_USERNAME: ${DB_USERNAME}
  DB_PASSWORD: ${DB_PASSWORD}
  JWT_SECRET: ${JWT_SECRET}
  MAIL_HOST: ${MAIL_HOST}
  MAIL_PORT: ${MAIL_PORT}
  MAIL_USERNAME: ${MAIL_USERNAME}
  MAIL_PASSWORD: ${MAIL_PASSWORD}
  MAIL_FROM: ${MAIL_FROM}
  APP_BASE_URL: ${APP_BASE_URL}

# backend와 worker의 healthcheck. JRE 이미지에 curl이 없어서, 이미 있는 bash로 health 주소에 요청을 보낸다.
# CMD-SHELL은 /bin/sh(dash)로 돌고, /dev/tcp는 bash에만 있는 기능이라 bash를 직접 부른다
x-backend-healthcheck: &backend-healthcheck
  test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /actuator/health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
  interval: 10s
  timeout: 3s
  retries: 3
  start_period: 60s

services:
  # Bandal의 입구. 화면 파일을 내주고 /api는 backend로 넘긴다. edge와 bandal 네트워크 둘 다에 붙는 건 이것뿐이다
  web:
    image: ${IMAGE_PREFIX:-bandal}-web:${IMAGE_TAG:-local}
    build: ../../frontend
    restart: unless-stopped
    mem_limit: 64m
    networks:
      default:
      edge:
        # edge에서는 서비스 이름(web) 대신 이 이름으로 찾는다. 다른 앱도 web이라는 서비스를 두면 edge 안에서 이름이 겹친다
        aliases: [bandal-web]
    depends_on:
      backend:
        condition: service_healthy

  backend:
    image: ${IMAGE_PREFIX:-bandal}-backend:${IMAGE_TAG:-local}
    build: ../../backend
    restart: unless-stopped
    # JVM 힙은 이 값의 75%다(Dockerfile)
    mem_limit: 1g
    # 웹 요청, 스케줄러(자동 마감, outbox 집배원)를 맡는다. Kafka 컨슈머는 꺼져 있다(application.yml 기본값)
    environment:
      <<: *backend-env
    # ports가 없다. bandal 네트워크 안의 web과 monitoring 네트워크의 Prometheus만 이 컨테이너에 닿는다
    networks:
      default:
      monitoring:
        # Prometheus는 이 이름으로 긁는다. 다른 앱의 backend와 이름이 겹치지 않게
        aliases: [bandal-backend]
    healthcheck: *backend-healthcheck
    # Kafka는 기다리지 않는다. Kafka가 죽어도 방 기능은 돌아야 한다(상태 변경은 outbox에 쌓였다가 Kafka가 살아나면 나간다)
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Kafka 컨슈머(알림, 통계)만 도는 컨테이너. 이미지는 backend와 같고 설정 두 개만 다르다
  # 따로 띄우는 이유: 컨슈머가 메모리나 스레드를 먹거나 멈춰도 웹 요청을 받는 backend는 흔들리지 않는다
  # 이 컨테이너를 내려도 방 기능과 이미 받은 알림 보기는 그대로고, 다시 올리면 밀린 글을 책갈피부터 따라잡는다
  worker:
    image: ${IMAGE_PREFIX:-bandal}-backend:${IMAGE_TAG:-local}
    restart: unless-stopped
    # 웹 요청을 받지 않아 backend보다 작게 준다. 띄운 뒤 실제 사용량을 보고 다시 정한다
    mem_limit: 768m
    environment:
      <<: *backend-env
      # 컨슈머를 켠다
      APP_KAFKA_CONSUMERS_ENABLED: "true"
      # 스케줄러를 끈다. 켜 두면 자동 마감과 outbox 집배원이 backend와 여기서 두 번씩 돈다
      APP_SCHEDULING_ENABLED: "false"
    # 웹 서버(8080)는 그대로 뜨지만 web(입구)은 backend로만 넘기므로 사람의 요청은 여기 오지 않는다.
    # 8080은 healthcheck와 Prometheus(DLT로 옮긴 글 수 같은 숫자)만 쓴다
    networks:
      default:
      monitoring:
        aliases: [bandal-worker]
    healthcheck: *backend-healthcheck
    depends_on:
      # backend가 먼저 떠서 마이그레이션(Flyway)을 끝낸 뒤에 뜬다. 둘이 동시에 테이블을 바꾸려 하지 않게
      backend:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # 묶음 작업(Spring Batch Job)을 하나 돌리고 꺼지는 컨테이너. 계속 떠 있지 않는다
  # 서버 cron이 매일 batch.sh로 띄운다: docker compose run --rm batch (Job 이름과 날짜는 batch.sh가 넘긴다)
  # profiles: 이름을 콕 집어 부를 때만 뜬다. 배포의 docker compose up은 이 서비스를 띄우지 않는다
  # 따로 띄우는 이유: Job이 메모리나 DB 커넥션을 많이 써도 웹 요청을 받는 backend는 흔들리지 않는다(worker와 같은 이유)
  batch:
    image: ${IMAGE_PREFIX:-bandal}-backend:${IMAGE_TAG:-local}
    profiles: [batch]
    # 하루 몇 초~몇 분 도는 동안만 쓴다
    mem_limit: 512m
    environment:
      <<: *backend-env
      # 웹 서버를 띄우지 않는다. 8080을 열지 않고, Job이 끝나면 꺼진다
      SPRING_MAIN_WEB_APPLICATION_TYPE: none
      # 자동 마감, outbox 집배원은 backend가 한다. 여기서 또 돌면 두 번씩 돈다
      APP_SCHEDULING_ENABLED: "false"
      # 뜰 때 Job을 돌린다(backend, worker는 꺼 둔다). 돌릴 Job 이름(SPRING_BATCH_JOB_NAME)은 batch.sh가 준다
      SPRING_BATCH_JOB_ENABLED: "true"
      # Job이 끝나면 앱을 끄고 결과를 종료 코드로 알린다(BandalApplication.main)
      APP_BATCH_EXIT_WHEN_DONE: "true"
    # ports가 없고 웹 서버도 없다. postgres(와 Kafka 토픽 확인)만 쓴다
    networks:
      default:

  # 방 상태 변경 글을 붙여 두는 Kafka. ZooKeeper 없이 혼자 뜬다(KRaft, 브로커와 컨트롤러를 한 몸에)
  # 로컬(docker-compose.yml)과 같은 설정에서 내 컴퓨터용 문(HOST)만 뺐다. ports가 없어서 bandal 네트워크 밖에서는 닿지 않는다
  kafka:
    image: apache/kafka:4.0.0
    restart: unless-stopped
    # 힙 512MB + 힙 밖 메모리(네트워크 버퍼, 페이지 캐시는 컨테이너 밖 커널 몫)
    mem_limit: 1g
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # 문 두 개: 컨테이너끼리(19092), 컨트롤러끼리(9093)
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      # 브로커가 한 대라 복제본도 하나뿐이다. 기본값(3)이면 내부 토픽을 못 만든다
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # 없는 토픽에 쓰면 저절로 만들지 않는다. 토픽은 앱(KafkaTopicConfig)이 칸 수와 보관 기간을 정해 만든다.
      # 저절로 만들게 두면 이름을 잘못 쓴 글이 칸 1개, 보관 7일짜리 토픽으로 조용히 간다(2026-10-27 DLT 이름에서 겪음)
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
      # 붙인 글을 디스크에 두는 곳. 아래 볼륨에 두어야 컨테이너를 지워도 글이 남는다
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:19092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  postgres:
    image: postgres:17
    restart: unless-stopped
    mem_limit: 512m
    environment:
      POSTGRES_DB: bandal
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      # 컨테이너를 지우고 새로 만들어도 데이터는 이 볼륨에 남는다
      - postgres-data:/var/lib/postgresql/data
    # ports가 없다. 밖에서도, 바깥 Nginx에서도 닿지 않는다
    # stats-db: Grafana가 통계 표를 읽으러 오는 길. Grafana와 postgres만 붙는다. Grafana는 읽기 전용 계정(grafana_reader)으로 붙는다
    networks:
      default:
      stats-db:
        # 다른 앱의 postgres와 이름이 겹치지 않게
        aliases: [bandal-postgres]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d bandal"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # 리프레시 토큰이 들어 있어서, 메모리가 차도 키를 멋대로 지우는 설정(maxmemory 정책)은 켜지 않는다
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  # default는 이 파일이 만드는 bandal 전용 네트워크(bandal_default)다
  edge:
    external: true
  # 관측 묶음(deploy/monitoring)과 같이 쓴다. deploy.sh가 없으면 만든다
  monitoring:
    external: true
  # Grafana와 postgres만 쓰는 네트워크. deploy.sh가 없으면 internal(인터넷으로 못 나감)로 만든다
  stats-db:
    external: true

volumes:
  postgres-data:
  kafka-data:
