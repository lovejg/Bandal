# 서버의 /srv/edge에 놓이는 바깥 Nginx. 두 앱이 같이 쓴다. 구조는 DESIGN.md 6번 "배포 구조"
# 먼저: docker network create edge
# 실행: docker compose up -d
name: edge

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    mem_limit: 64m
    # 서버가 밖으로 여는 포트는 이것뿐이다. 로컬에서 확인할 때는 EDGE_HTTP_PORT로 다른 번호를 쓴다
    # HTTPS(443)는 도메인을 정한 뒤 붙인다
    ports:
      - "${EDGE_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    # edge에만 붙는다. 각 앱의 입구(bandal-web 등)는 보이지만 backend와 DB는 이름조차 모른다
    networks: [edge]

networks:
  edge:
    external: true
