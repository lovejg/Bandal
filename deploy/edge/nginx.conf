# 바깥 Nginx. 주소(Host)만 보고 앱 입구로 보낸다. 앱 안의 길(/api 등)은 각 앱의 입구가 정한다
# HTTPS는 여기서 풀고, 안쪽(같은 서버의 Docker 네트워크)으로는 평문 HTTP로 넘긴다
# 앱을 하나 더 붙이면: 그 도메인의 인증서를 받고(cert.sh issue) 443 server 블록을 하나 더한다

# 도커 안의 이름 풀이. 입구 컨테이너가 다시 만들어져 IP가 바뀌어도 10초 안에 다시 찾는다.
# 주소를 변수로 두면, 입구가 아직 안 떠 있어도 이 Nginx는 뜬다
resolver 127.0.0.11 valid=10s;

# 모든 사이트가 같이 쓰는 TLS 설정. 1.0, 1.1은 오래되어 받지 않는다
ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;

# 접속 기록에 요청 id(rid)와 걸린 시간(rt, 초)을 더한 모양. 같은 id를 backend로 넘기므로 Loki에서 입구와 앱의 로그를 같은 id로 잇는다
# 쓰는 곳은 bandal.site, codexray.org server 블록이다. 여기(http 수준)에 access_log를 또 적으면 기본 설정의 access_log와 둘 다 살아서 줄이 두 번 찍힌다
log_format main_rid '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                    '"$http_user_agent" rid=$request_id rt=$request_time';

# 80번: 어느 도메인이든 인증서 증명 파일만 내주고, 나머지는 같은 주소의 https로 돌려보낸다.
# 막지 않는 건 주소창에 bandal.site만 치거나 옛 링크로 온 사람이 사이트를 못 여는 일이 없게 하려고.
# 증명 파일은 Let's Encrypt가 80번으로만 가져가서 이 포트는 계속 열어 둔다
server {
    listen 80 default_server;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 443번에서 모르는 도메인(IP로 직접 두드리는 봇 포함)은 인증서를 보여 주기 전에 끊는다
server {
    listen 443 ssl default_server;
    ssl_reject_handshake on;
}

# www는 주소 하나로 모은다. 인증서 하나에 두 이름이 같이 들어 있다
server {
    listen 443 ssl;
    http2 on;
    server_name www.bandal.site;
    ssl_certificate /etc/nginx/certs/bandal.site/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/bandal.site/privkey.pem;

    return 301 https://bandal.site$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name bandal.site;
    ssl_certificate /etc/nginx/certs/bandal.site/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/bandal.site/privkey.pem;

    # 이 응답을 본 브라우저는 정한 기간 동안 http로 아예 오지 않는다. 첫 http 요청을 가로채는 공격을 막는다.
    # 길게 걸면 되돌릴 수 없어서 단계로 늘린다. 하루로 시작했고 지금 30일이다. 첫 자동 갱신이 성공하면 1년으로 올린다.
    # includeSubDomains는 www 같은 서브도메인도 https로만 오게 한다. preload는 빼기 어려워서 걸지 않는다
    add_header Strict-Transport-Security "max-age=2592000; includeSubDomains" always;

    # 이 블록의 접속 기록만 위 모양으로 남긴다. 컨테이너의 표준 출력으로 가서 Alloy가 Loki로 옮긴다
    access_log /var/log/nginx/access.log main_rid;

    # Compose가 붙이는 컨테이너 이름(프로젝트-서비스-번호)이 아니라 edge 네트워크 안의 별칭으로 찾는다
    set $bandal http://bandal-web:80;

    location / {
        proxy_pass $bandal;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 안쪽은 평문이라, 원래 요청이 https였다는 걸 이 헤더로 알려 준다
        proxy_set_header X-Forwarded-Proto $scheme;
        # 요청마다 Nginx가 만드는 16진수 32자. 브라우저가 보낸 같은 이름의 헤더는 이 값으로 덮어쓴다
        proxy_set_header X-Request-Id $request_id;
    }
}

# ===== codeXray (저장소 lovejg/codeXray_Spring, 서버의 /srv/codexray) =====

server {
    listen 443 ssl;
    http2 on;
    server_name www.codexray.org;
    ssl_certificate /etc/nginx/certs/codexray.org/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/codexray.org/privkey.pem;

    return 301 https://codexray.org$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name codexray.org;
    ssl_certificate /etc/nginx/certs/codexray.org/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/codexray.org/privkey.pem;

    # Bandal과 같은 이유로 단계로 늘린다. 하루로 시작한다(2026-10-29). 그 뒤 30일, 첫 자동 갱신이 성공하면 1년
    add_header Strict-Transport-Security "max-age=86400; includeSubDomains" always;

    access_log /var/log/nginx/access.log main_rid;

    # codeXray 입구(frontend 컨테이너)의 edge 네트워크 별칭
    set $codexray http://codexray-web:80;

    location / {
        proxy_pass $codexray;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
    }
}
