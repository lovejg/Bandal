# 바깥 Nginx. 주소(Host)만 보고 앱 입구로 보낸다. 앱 안의 길(/api 등)은 각 앱의 입구가 정한다
# 앱을 하나 더 붙이면 server 블록을 하나 더한다

# 도커 안의 이름 풀이. 입구 컨테이너가 다시 만들어져 IP가 바뀌어도 10초 안에 다시 찾는다.
# 주소를 변수로 두면, 입구가 아직 안 떠 있어도 이 Nginx는 뜬다
resolver 127.0.0.11 valid=10s;

# 모르는 주소로 오면 응답 없이 끊는다. IP로 직접 두드리는 봇에게 아무것도 보여 주지 않는다
server {
    listen 80 default_server;
    return 444;
}

server {
    listen 80;
    # 도메인을 정하면 bandal.<도메인>을 더한다. bandal.localhost는 로컬 확인용(브라우저가 127.0.0.1로 보낸다)
    server_name bandal.localhost;

    # Compose가 붙이는 컨테이너 이름(프로젝트-서비스-번호)이 아니라 edge 네트워크 안의 별칭으로 찾는다
    set $bandal http://bandal-web:80;

    location / {
        proxy_pass $bandal;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
