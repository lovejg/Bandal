# 무엇을 얼마마다 긁을지. 앱을 하나 더 붙이면 job을 하나 더한다
global:
  # 부하 테스트는 몇 분짜리라, 15초(기본)보다 촘촘히 긁어야 그래프에 흐름이 보인다
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: bandal
    metrics_path: /actuator/prometheus
    static_configs:
      # monitoring 네트워크 안에서 bandal backend가 쓰는 이름(deploy/bandal/compose.yml)
      - targets: ["bandal-backend:8080"]
        labels:
          env: prod

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          env: prod

  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
