# 서버의 /srv/monitoring에 놓이는 관측 묶음. 앱마다 따로 두지 않고 서버에 하나만 둔다
# Prometheus: 앱과 서버의 숫자를 10초마다 긁어 쌓는다. Grafana: 그 숫자를 그래프로 본다. node-exporter: 서버 CPU, 메모리, 디스크
# 배포 작업이 이 폴더를 올리고 ./up.sh로 띄운다. 처음 한 번 Grafana 관리자 비밀번호를 만들어 .env에 둔다
# 앱은 monitoring 네트워크에 붙어 있어야 긁힌다(deploy/bandal/compose.yml의 backend)
name: monitoring

services:
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    mem_limit: 512m
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # 배포는 6개월쯤 유지한다. 그동안의 숫자를 다 남긴다. 10초 간격이면 한 달에 수백 MB 수준이다
      - --storage.tsdb.retention.time=200d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    # ports가 없다. Grafana만 같은 네트워크 안에서 부른다
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 6

  grafana:
    image: grafana/grafana:12.0.2
    restart: unless-stopped
    mem_limit: 256m
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # up.sh가 처음 한 번 무작위로 만든다. git에는 없다
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?up.sh로 띄우세요}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    # 인터넷에는 열지 않는다. 서버 자신(127.0.0.1)에만 열고, 내 PC에서는 SSH 터널로 들어온다
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 6
    depends_on:
      prometheus:
        condition: service_healthy

  # 컨테이너 안에서 서버 전체를 본다. 서버의 / 를 읽기 전용으로 들여다보고, 프로세스 목록도 서버 것을 쓴다
  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    mem_limit: 64m
    pid: host
    command:
      - --path.rootfs=/host
    # 문서 예시는 ro,rslave(나중에 생긴 마운트도 따라 봄)인데, 서버의 / 가 공유 마운트가 아니면 컨테이너가 뜨지 않는다.
    # 디스크 사용량과 CPU, 메모리만 보면 되어서 읽기 전용으로만 붙인다
    volumes:
      - /:/host:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9100/metrics"]
      interval: 30s
      timeout: 3s
      retries: 3

networks:
  # 앱의 backend들과 같이 쓰는 네트워크. up.sh와 deploy.sh가 없으면 만든다
  default:
    name: monitoring
    external: true

volumes:
  prometheus-data:
  grafana-data:
