# 서버의 /srv/monitoring에 놓이는 관측 묶음. 앱마다 따로 두지 않고 서버에 하나만 둔다
# Prometheus: 앱과 서버의 숫자를 10초마다 긁어 쌓는다. Grafana: 그 숫자와 로그를 본다. node-exporter: 서버 CPU, 메모리, 디스크
# Loki: 컨테이너 로그를 모아 둔다. Alloy: 컨테이너 로그를 읽어 Loki로 보낸다. docker-proxy: Alloy가 Docker를 읽기만 하게 하는 문
# 배포 작업이 이 폴더를 올리고 ./up.sh로 띄운다. 처음 한 번 Grafana 관리자 비밀번호를 만들어 .env에 둔다
# 앱은 monitoring 네트워크에 붙어 있어야 긁힌다(deploy/bandal/compose.yml의 backend)
name: monitoring

services:
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    mem_limit: 512m
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # 배포는 6개월쯤 유지한다. 그동안의 숫자를 다 남긴다. 10초 간격이면 한 달에 수백 MB 수준이다
      - --storage.tsdb.retention.time=200d
    # 파일 하나가 아니라 폴더를 붙인다. 파일 하나를 붙이면 Docker가 그 파일의 실체(inode)를 잡고 있어서,
    # 배포의 tar가 파일을 새로 만들어 바꾸면 컨테이너는 옛 파일을 계속 본다. 폴더는 안의 파일이 바뀌면 바로 보인다
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    # ports가 없다. Grafana만 같은 네트워크 안에서 부른다
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 6

  grafana:
    image: grafana/grafana:12.0.2
    restart: unless-stopped
    mem_limit: 256m
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # up.sh가 처음 한 번 무작위로 만든다. git에는 없다
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?up.sh로 띄우세요}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    # 인터넷에는 열지 않는다. 서버 자신(127.0.0.1)에만 열고, 내 PC에서는 SSH 터널로 들어온다
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 6
    depends_on:
      prometheus:
        condition: service_healthy

  # 컨테이너 안에서 서버 전체를 본다. 서버의 / 를 읽기 전용으로 들여다보고, 프로세스 목록도 서버 것을 쓴다
  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    mem_limit: 64m
    pid: host
    command:
      - --path.rootfs=/host
    # 문서 예시는 ro,rslave(나중에 생긴 마운트도 따라 봄)인데, 서버의 / 가 공유 마운트가 아니면 컨테이너가 뜨지 않는다.
    # 디스크 사용량과 CPU, 메모리만 보면 되어서 읽기 전용으로만 붙인다
    volumes:
      - /:/host:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9100/metrics"]
      interval: 30s
      timeout: 3s
      retries: 3

  # 로그 저장소. Alloy가 보내고 Grafana가 읽는다. ports가 없다
  loki:
    image: grafana/loki:3.7.8
    restart: unless-stopped
    mem_limit: 512m
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./loki:/etc/loki:ro
      - loki-data:/loki
    # healthcheck가 없다. 이 이미지에는 셸도 wget도 없어서 컨테이너 안에서 /ready를 물어볼 방법이 없다.
    # Loki가 늦게 떠도 Alloy가 보내기를 다시 시도하므로 순서는 "시작만 했으면" 된다

  # 이 서버의 모든 컨테이너 로그를 읽어 Loki로 보낸다. 로그가 컨테이너에 붙어 있어서 배포로 컨테이너가 지워지면 같이 사라지는데,
  # 그 전에 Loki로 옮겨 둔다
  alloy:
    image: grafana/alloy:v1.20.1
    restart: unless-stopped
    mem_limit: 256m
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy:/etc/alloy:ro
      # 컨테이너마다 어디까지 읽었는지. 지우면 처음부터 다시 보낸다
      - alloy-data:/var/lib/alloy/data
    networks:
      default:
      docker-proxy:
    depends_on:
      loki:
        condition: service_started
      docker-proxy:
        condition: service_started

  # Docker 소켓을 Alloy에 바로 붙이지 않으려고 둔 문지기. 소켓을 쥐면 컨테이너를 만들고 지우는 것까지 다 할 수 있다(서버 root와 같다).
  # 이 문은 컨테이너 목록과 로그 "읽기"(GET)만 열고 나머지는 403으로 막는다. Alloy만 붙는 내부 네트워크에만 있다
  # 다만 컨테이너 정보 읽기에는 환경 변수(비밀값)도 들어 있다. 그래서 이 네트워크에는 Alloy 말고 아무것도 붙이지 않는다
  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    restart: unless-stopped
    mem_limit: 64m
    environment:
      CONTAINERS: 1
      # Alloy의 컨테이너 찾기가 네트워크 목록도 읽는다. 없으면 403으로 아무 컨테이너도 못 찾는다
      NETWORKS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-proxy

networks:
  # 앱의 backend들과 같이 쓰는 네트워크. up.sh와 deploy.sh가 없으면 만든다
  default:
    name: monitoring
    external: true
  # Alloy와 docker-proxy만 쓰는 네트워크. internal이라 밖(인터넷)으로도 나가지 못한다
  docker-proxy:
    internal: true

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
  alloy-data:
