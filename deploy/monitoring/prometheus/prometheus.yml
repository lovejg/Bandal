# 무엇을 얼마마다 긁을지. 앱을 하나 더 붙이면 job을 하나 더한다
global:
  # 부하 테스트는 몇 분짜리라, 15초(기본)보다 촘촘히 긁어야 그래프에 흐름이 보인다
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: bandal
    metrics_path: /actuator/prometheus
    static_configs:
      # monitoring 네트워크 안에서 bandal backend가 쓰는 이름(deploy/bandal/compose.yml)
      - targets: ["bandal-backend:8080"]
        labels:
          env: prod

  # Kafka 컨슈머만 도는 worker(deploy/bandal/compose.yml). backend와 같은 앱이지만 job을 나눈다.
  # 같은 job에 넣으면 응답 시간 같은 웹 숫자 그래프에 worker의 숫자(healthcheck 요청뿐)가 섞인다
  # 여기서 볼 것: DLT로 옮긴 글 수(bandal_kafka_dead_letter_total), 컨슈머 지연, JVM 메모리
  - job_name: bandal-worker
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["bandal-worker:8080"]
        labels:
          env: prod

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          env: prod

  # 부하 테스트 서버(bandal-loadtest). 테스트할 때만 켜서, 꺼져 있는 동안은 down으로 보이는 게 정상이다.
  # 사설 IP는 서버를 새로 만들면 바뀐다. 그때 여기를 고친다
  - job_name: bandal-loadtest
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["10.0.0.28:8081"]
        labels:
          env: loadtest

  - job_name: node-loadtest
    static_configs:
      - targets: ["10.0.0.28:9100"]
        labels:
          env: loadtest

  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
