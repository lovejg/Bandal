# 무엇을 얼마마다 긁을지. 앱을 하나 더 붙이면 job을 하나 더한다
global:
  # 부하 테스트는 몇 분짜리라, 15초(기본)보다 촘촘히 긁어야 그래프에 흐름이 보인다
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: bandal
    metrics_path: /actuator/prometheus
    static_configs:
      # monitoring 네트워크 안에서 bandal backend가 쓰는 이름(deploy/bandal/compose.yml)
      - targets: ["bandal-backend:8080"]
        labels:
          env: prod

  # Kafka 컨슈머만 도는 worker(deploy/bandal/compose.yml). backend와 같은 앱이지만 job을 나눈다.
  # 같은 job에 넣으면 응답 시간 같은 웹 숫자 그래프에 worker의 숫자(healthcheck 요청뿐)가 섞인다
  # 여기서 볼 것: DLT로 옮긴 글 수(bandal_kafka_dead_letter_total), 컨슈머 지연, JVM 메모리
  - job_name: bandal-worker
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["bandal-worker:8080"]
        labels:
          env: prod

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          env: prod

  # 부하 테스트 서버는 측정을 마치고 내렸다. 지난 측정 숫자는 보관 기간 동안 env=loadtest로 남는다.
  # 다시 띄우면 bandal-loadtest(<사설 IP>:8081, /actuator/prometheus)와 node-loadtest(<사설 IP>:9100) job을
  # env: loadtest 꼬리표로 다시 더한다
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
