# Grafana 경고: 무엇을 1분마다 묻고, 울리면 어디로 보내나. 화면에서 만들지 않고 이 파일이 원본이다
# 메일은 가입 메일과 같은 Resend SMTP로 나간다(GF_SMTP_*, 받는 주소 ALERT_EMAIL은 .env.alerting. 배포 작업이 쓴다)
apiVersion: 1

# 받는 곳. 운영자 메일 한 곳
contactPoints:
  - orgId: 1
    name: operator-email
    receivers:
      - uid: operator-email
        type: email
        settings:
          # git에 메일 주소를 두지 않는다. Grafana가 뜰 때 환경 변수 값으로 바꾼다
          addresses: $ALERT_EMAIL
          singleEmail: true
        # 풀렸을 때도 메일 한 통(복구됐다)을 보낸다
        disableResolveMessage: false

# 모든 경고를 위 메일로. 같은 경고가 계속 울리는 중이면 4시간마다 한 번만 다시 보낸다
policies:
  - orgId: 1
    receiver: operator-email
    group_by: ["alertname"]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h

groups:
  - orgId: 1
    name: kafka
    folder: Bandal
    # 1분마다 묻는다. 따로 스케줄러를 두지 않는다
    interval: 1m
    rules:
      # 처리하지 못한 글이 DLT로 갔다. 평소에는 0이어야 하는 숫자라 1건이라도 울린다
      # 받으면: 서버에서 /srv/bandal/dlt-replay.sh로 원인(예외 종류)을 보고, 고친 뒤 replay
      - uid: bandal-dead-letter
        title: DLT로 옮긴 글이 있다
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              # 최근 5분 동안 늘어난 수. worker가 다시 떠 카운터가 0으로 돌아가도 increase()가 알아서 이어 센다
              # 카운터는 앱이 뜰 때 0으로 만들어 둔다(KafkaErrorHandlingConfig). 그래야 첫 DLT(0 → 1)도 늘어난 것으로 잡힌다
              expr: sum(increase(bandal_kafka_dead_letter_total{job="bandal-worker"}[5m]))
              instant: true
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        # 숫자 자체가 없으면(worker가 죽음) 이 경고가 아니라 아래 worker 경고가 맡는다
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: 처리하지 못한 글이 DLT(group-order-status-dlt)로 옮겨졌다
          description: 서버에서 /srv/bandal/dlt-replay.sh 로 칸, 오프셋, 실패한 그룹, 예외를 본다. 원인을 고친 뒤 dlt-replay.sh replay

      # worker가 응답하지 않는다. worker가 죽으면 위의 DLT 숫자를 낼 쪽이 없어 DLT 경고도 영영 안 울린다. 그래서 같이 건다
      # 배포 중 몇십 초 내려가는 건 울리지 않게 5분 동안 계속될 때만 울린다
      - uid: bandal-worker-down
        title: worker가 응답하지 않는다
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              # Prometheus가 긁는 데 성공하면 1, 실패하면 0
              expr: up{job="bandal-worker"}
              instant: true
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
        # 숫자가 아예 없으면(Prometheus 설정에서 빠짐 등) 그것도 문제로 본다
        noDataState: Alerting
        execErrState: Error
        for: 5m
        annotations:
          summary: worker(알림, 통계 컨슈머)가 5분 넘게 응답하지 않는다
          description: 알림과 통계가 멈췄다. 글은 Kafka에 쌓여 있어 worker를 다시 띄우면 따라잡는다. 서버에서 docker compose ps worker, logs worker를 본다
