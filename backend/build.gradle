plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.bandal'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // 응답 시간, 커넥션 풀, JVM 숫자를 Prometheus가 읽는 글 모양으로 /actuator/prometheus에 내놓는다
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    // 테이블은 번호 붙인 SQL 파일(src/main/resources/db/migration)로 만들고 바꾼다
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    // Flyway 10부터 DB마다 모듈이 따로 있다
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    // 리프레시 토큰 저장소. 나중에 캐싱에도 쓴다
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    // JWT 발급과 검증
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
    // 인증 메일 발송. 로컬에서는 Mailpit이 받는다
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    // 방 상태 변경을 Kafka 토픽에 넣고(집배원), worker가 읽는다
    implementation 'org.springframework.boot:spring-boot-starter-kafka'
    // 정리, 집계 같은 묶음 작업(Spring Batch). 실행 기록(메타 표)을 DB에 남기는 JDBC 판이다
    implementation 'org.springframework.boot:spring-boot-starter-batch-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testImplementation 'org.testcontainers:testcontainers-kafka'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
}

// 실행용 jar 이름을 고정한다. Dockerfile이 이 이름으로 꺼내 간다
tasks.named('bootJar') {
    archiveFileName = 'bandal.jar'
}

// 실행할 수 없는 jar(-plain.jar)는 만들지 않는다. 쓰는 곳이 없다
tasks.named('jar') {
    enabled = false
}

// 로컬에서 ./gradlew bootRun으로 띄울 때만 dev 프로필을 켠다. 개발용 계정과 거점이 심어진다
// 테스트와 배포용 jar에는 걸리지 않는다. 다른 프로필로 띄우려면 --args='--spring.profiles.active=...'가 이긴다
tasks.named('bootRun') {
    systemProperty 'spring.profiles.active', 'dev'
}
