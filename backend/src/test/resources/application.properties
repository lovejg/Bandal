# 테스트에서만 읽힌다. main의 application.yml 위에 덮어쓴다
# 스케줄러가 저절로 돌면 테스트가 만든 방을 중간에 넘겨버린다. 테스트는 시각을 정해 직접 부른다
app.scheduling.enabled=false

# 테스트는 dev 프로필을 켜지 않는다. DB와 Redis 주소는 Testcontainers가 넣어 주고, 나머지는 여기서 준다
# 테스트 전용 값이라 공개돼도 된다
jwt.secret=bandal-test-only-secret-key-at-least-32-bytes
app.verify-link-base=http://localhost:8080/api/auth/verify
app.mail-from=no-reply@bandal.local
# 메일 서버 주소가 있어야 스프링이 메일 보내는 객체(JavaMailSender)를 만든다. 실제로 받는 곳은 없다
spring.mail.host=localhost
spring.mail.port=1025
