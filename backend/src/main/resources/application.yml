# 어디서나 같은 설정. 환경마다 다른 값은 application-dev.yml(로컬), application-prod.yml(운영)이 덮어쓴다.
# ${...}는 밖(환경 변수)에서 받는 비밀값이다. 기본값을 두지 않아서, 빠뜨리면 앱이 뜨지 않는다.
# 기본값이 있으면 운영에서 빠뜨려도 GitHub에 공개된 개발용 값으로 조용히 뜬다.
spring:
  application:
    name: bandal

  # 사용자 저장소를 따로 만들지 않으면 Spring Security가 "user"라는 기본 계정을 메모리에 만들고 그 비밀번호를 로그에 찍는다.
  # 우리 로그인은 JWT라 이 계정을 쓸 곳이 없다. 운영 로그에 비밀번호가 남지 않게 이 자동 설정을 끈다
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

  datasource:
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      # 테이블은 Flyway가 만든다. Hibernate는 엔티티와 테이블이 맞는지만 보고, 안 맞으면 앱이 뜨지 않는다
      ddl-auto: validate
    # 기본값이 true라서 컨트롤러가 응답을 다 쓸 때까지 DB 커넥션을 잡고 있는다.
    # 커넥션을 오래 물고 있으면 나중에 부하 테스트에서 그대로 병목이 된다. 꺼둔다.
    open-in-view: false

  data:
    redis:
      # 명령 하나의 응답을 기다리는 최대 시간. 기본값은 60초라, Redis가 느려지면 요청마다 그만큼 멈춘다
      # 캐시는 빨리 포기하고 DB로 가는 게 낫다
      timeout: 500ms

  kafka:
    producer:
      # 키(방 id)와 내용(JSON)은 문자열로 넣는다
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # 브로커가 디스크에 적었다고 답해야 성공으로 친다(브로커가 한 대라 그 한 대)
      acks: all
      properties:
        # 기본값은 브로커를 못 찾으면 60초, 답을 못 받으면 2분까지 기다린다. 집배원이 한 줄에 그만큼 묶이지 않게 줄인다
        # 실패하면 outbox 줄이 재시도로 다시 보낸다
        "[max.block.ms]": 5000
        "[request.timeout.ms]": 5000
        "[delivery.timeout.ms]": 10000
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # 책갈피가 없는 새 그룹은 토픽 맨 앞부터 읽는다. 기본값(latest)이면 그룹을 처음 띄우기 전에 쌓인 글을 건너뛴다
      auto-offset-reset: earliest

  batch:
    job:
      # 앱이 뜰 때 Job을 돌릴지. 기본값(true)이면 backend와 worker가 뜰 때마다 정리 Job이 돈다
      # 꺼 두고, batch 컨테이너만 켜서 Job 이름(spring.batch.job.name)과 날짜 파라미터를 주고 돌린다
      enabled: false
    jdbc:
      # 메타 표는 Flyway(V11__batch_metadata.sql)가 만든다. Spring Boot가 따로 만들지 않게
      initialize-schema: never

  mail:
    properties:
      # 기본값은 끝없이 기다린다(timeout -1). 메일 서버가 응답하지 않으면 인증 메일을 보내던 요청이 영영 붙잡힌다
      # 대괄호는 "점까지 포함해 키 하나"라는 뜻이다. JavaMail이 이 이름 그대로 읽는다
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 10000
      "[mail.smtp.writetimeout]": 10000

server:
  tomcat:
    # 요청을 처리하는 스레드 수(바쁨, 최대)를 숫자로 내보내려면 켜야 한다. 기본은 꺼져 있다
    mbeanregistry:
      enabled: true

# 토큰 설정
jwt:
  # HS256이라 32바이트 이상이어야 한다. 이 값이 새면 누구나 남의 토큰을 만들 수 있다
  secret: ${JWT_SECRET}
  # 액세스 토큰은 짧게. 탈취돼도 피해 시간을 줄인다
  access-token-minutes: 15
  # 리프레시 토큰은 길게. 이건 Redis에 저장해서 로그아웃 때 지운다
  refresh-token-days: 14

# 이메일 인증 설정
app:
  # 메일은 사람이 여는 매체라 액세스 토큰(15분)보다 길게 준다
  verification-token-minutes: 30
  # 재전송 제한. 창 안에서 이 횟수를 넘으면 429
  resend-limit: 5
  resend-window-minutes: 60
  # 방 목록 첫 페이지 캐시
  room-list-cache:
    # Phase 4 부하 테스트에서 끄고 켜며 비교한다
    enabled: true
    # 목록은 늦어도 이만큼만 옛것이다. 지우기를 빠뜨린 곳도 이 시간이 지나면 맞아진다
    ttl-seconds: 10
  # 가입 메일 outbox 집배원
  outbox:
    # 앞 실행이 끝나고 이만큼 쉰 뒤 다시 돈다. 사용자가 화면 앞에서 메일을 기다리므로 짧게
    poll-delay-ms: 5000
    # 첫 재시도까지 기다리는 시간. 실패할 때마다 두 배(30초, 1분, 2분, 4분)
    retry-base-seconds: 30
    # 한 번에 찜하는 줄 수
    batch-size: 10
  kafka:
    # 방 상태 변경을 넣는 토픽. 칸 3개, 키는 방 id라 같은 방은 늘 같은 칸에 줄을 선다
    group-order-status-topic: group-order-status
    # 컨슈머(알림, 통계)를 켤지. 웹 서버는 끄고 worker 컨테이너만 켠다. 컨슈머가 멈추거나 느려져도 웹은 흔들리지 않게
    consumers-enabled: false

management:
  endpoints:
    web:
      exposure:
        # prometheus는 Prometheus가 몇 초마다 긁어 가는 숫자 목록이다. 밖에서는 못 연다.
        # 바깥 Nginx와 web은 /api만 backend로 넘기고, Prometheus는 같은 Docker 네트워크 안에서 부른다
        include: health,info,prometheus
  metrics:
    tags:
      # 같은 Prometheus에 다른 앱이 붙어도 섞이지 않게 모든 숫자에 앱 이름을 붙인다
      application: bandal
    distribution:
      # 응답 시간을 구간별 개수(히스토그램)로도 내보낸다. 그래야 Prometheus가 p95, p99를 계산한다
      # spring.data.repository.invocations는 리포지토리 메서드마다 걸린 시간이다. findByIdForUpdate의 시간이 곧 락 대기다
      percentiles-histogram:
        http.server.requests: true
        spring.data.repository.invocations: true
  health:
    # 메일 서버에 못 닿는다고 앱 전체를 DOWN으로 보지 않는다. 메일이 멈춰도 방 목록, 참여, 정산은 된다.
    # DOWN이면 컨테이너가 unhealthy가 되어 입구(web)가 뜨지 않는다. DB와 Redis는 health에 남긴다
    mail:
      enabled: false
