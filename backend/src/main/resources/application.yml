spring:
  application:
    name: bandal

  datasource:
    # docker-compose.yml에서 5433으로 열었다. 기본 포트 5432는 다른 프로젝트가 쓴다.
    url: jdbc:postgresql://localhost:5433/bandal
    username: bandal
    password: bandal

  jpa:
    hibernate:
      # 앱을 띄울 때 테이블을 새로 만들고, 내릴 때 지운다.
      # 엔티티를 자주 고치는 지금 단계에 편하다. Phase 2에서 Flyway로 바꾼다.
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
    # 기본값이 true라서 컨트롤러가 응답을 다 쓸 때까지 DB 커넥션을 잡고 있는다.
    # 커넥션을 오래 물고 있으면 나중에 부하 테스트에서 그대로 병목이 된다. 꺼둔다.
    open-in-view: false

  data:
    redis:
      # docker-compose.yml에서 6380으로 열었다
      host: localhost
      port: 6380

  mail:
    # Mailpit. 밖으로 나가지 않고 http://localhost:8025 에 쌓인다
    host: localhost
    port: 1025

# 토큰 설정 (ADR-024, 026)
jwt:
  # HS256이라 32바이트 이상이어야 한다. 개발용이고, 배포할 때는 환경변수로 옮긴다.
  # 이 값이 새면 누구나 남의 토큰을 만들 수 있다.
  secret: bandal-local-dev-secret-key-change-me-in-production
  # 액세스 토큰은 짧게. 탈취돼도 피해 시간을 줄인다
  access-token-minutes: 15
  # 리프레시 토큰은 길게. 이건 Redis에 저장해서 로그아웃 때 지운다
  refresh-token-days: 14

# 이메일 인증 설정 (ADR-027)
app:
  # 메일에 들어갈 링크의 앞부분. 프론트가 생기면 이 줄만 프론트 주소로 바꾼다
  verify-link-base: http://localhost:8080/api/auth/verify
  # 메일은 사람이 여는 매체라 액세스 토큰(15분)보다 길게 준다
  verification-token-minutes: 30
  # 재전송 제한. 창 안에서 이 횟수를 넘으면 429
  resend-limit: 5
  resend-window-minutes: 60
  # 메일 보내는 사람 주소. 배포할 때 실제 도메인으로 바꾼다
  mail-from: no-reply@bandal.local

logging:
  level:
    # 실행되는 SQL을 눈으로 본다. JPA가 뭘 하는지 모르고 넘어가지 않기 위해서.
    org.hibernate.SQL: debug
    # 물음표 자리에 실제로 들어간 값까지 보여준다.
    org.hibernate.orm.jdbc.bind: trace

management:
  endpoints:
    web:
      exposure:
        include: health,info
