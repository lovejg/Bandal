# 운영 서버. 서버 안의 Docker Compose가 SPRING_PROFILES_ACTIVE=prod로 띄운다.
# 비밀값(DB 계정, JWT 비밀키, 메일 계정)은 application.yml의 ${...} 자리로 환경 변수에서 받는다.
# 여기에는 비밀이 아니지만 운영에서만 다른 값을 둔다
spring:
  datasource:
    # 같은 Compose 안의 Postgres 컨테이너. 밖으로는 열지 않는다
    url: jdbc:postgresql://postgres:5432/bandal

  data:
    redis:
      host: redis
      port: 6379

  # 메일은 발송 서비스(Resend)의 SMTP로 보낸다. 주소와 계정은 환경 변수로 받는다
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    # 로컬 Mailpit은 로그인도 암호화도 없지만, 바깥 SMTP는 둘 다 요구한다.
    # starttls.required: 암호화 연결을 못 맺으면 평문으로 보내지 않고 실패한다(계정 비밀번호가 평문으로 흐르지 않게)
    properties:
      "[mail.smtp.auth]": true
      "[mail.smtp.starttls.enable]": true
      "[mail.smtp.starttls.required]": true

app:
  verify-link-base: ${APP_BASE_URL}/api/auth/verify
  mail-from: ${MAIL_FROM}

# SQL 로그는 켜지 않는다. 기본값(INFO)이면 시작, 경고, 에러만 남는다
logging:
  structured:
    format:
      # 한 줄에 JSON 하나로 찍는다. 시각, 레벨, 메시지, MDC(requestId, userId 같은 것)가 각각 칸이 된다.
      # Loki에서 칸으로 거르고 묶는다. 로컬(dev)은 사람이 읽기 쉬운 평문 그대로 둔다
      console: logstash
