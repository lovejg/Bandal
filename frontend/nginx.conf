# bandal-web의 Nginx 설정. 로컬에서 vite 개발 서버가 하던 일을 그대로 한다
server {
    listen 80;
    root /usr/share/nginx/html;

    # 글자로 된 응답(JS, CSS, JSON, HTML)은 gzip으로 줄여 보낸다. 바깥 Nginx는 받은 그대로 넘기므로 여기서 한 번만 한다
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    # 바깥 Nginx는 여기로 HTTP/1.0으로 넘긴다(proxy_http_version 기본값). gzip은 기본으로 1.1 요청에만 압축해서
    # 이 줄이 없으면 운영에서는 압축이 안 된다. 브라우저가 직접 붙는 로컬에서는 드러나지 않는다
    gzip_http_version 1.0;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 도커 안의 이름 풀이(DNS). backend 컨테이너가 다시 만들어지면 IP가 바뀐다.
    # 주소를 변수로 두면 Nginx가 뜰 때 한 번만 찾지 않고 10초마다 다시 찾는다. backend가 아직 없어도 Nginx는 뜬다
    resolver 127.0.0.11 valid=10s;
    set $backend http://backend:8080;

    # /api는 bandal 네트워크 안의 backend로 넘긴다. 주소는 그대로(/api/...) 넘어간다
    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # vite가 만든 파일은 이름에 내용의 해시가 붙는다. 내용이 바뀌면 이름도 바뀌니 오래 캐시해도 된다.
    # expires와 add_header를 같이 쓰면 Cache-Control 줄이 두 개 나간다. 한 줄로 쓴다
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 화면 안의 주소(/rooms/3 같은 것)는 파일이 아니다. 전부 index.html을 내주고 React가 화면을 고른다
    location / {
        try_files $uri /index.html;
        # index.html은 캐시하지 않는다. 새 버전을 올리면 바로 새 파일 이름을 가리켜야 한다
        add_header Cache-Control "no-cache";
    }
}
