<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>반달</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <!-- 금액용 고정폭 숫자. 숫자와 기호만 받아서(text=) 몇 KB로 끝난다. 기기마다 깔린 고정폭 글꼴이 달라서 직접 불러온다 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&text=0123456789%2C.%3A%2F%2B-%23%25&display=swap"
    />
    <script>
      // 고른 테마를 그리기 전에 적용한다. 안 그러면 다크 모드에서 흰 화면이 한 번 번쩍인다
      try {
        var saved = localStorage.getItem('bandal.theme')
        if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
