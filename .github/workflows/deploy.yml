# main의 CI가 초록이 되면 이어서 돈다. 이미지를 만들어 GHCR에 올리고, 서버에 들어가 새 버전으로 바꿔 띄운다
# 구조는 DESIGN.md 6번 "배포 구조"
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# 배포는 하나씩. 앞의 배포가 서버에서 도는 중에 취소하면 반쯤 바뀐 채로 남는다. 그래서 취소하지 않고 기다린다
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  images:
    # PR이 아니라 main에 push되어 돈 CI가 성공했을 때만
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # GHCR에 이미지를 올린다. 따로 만든 토큰 없이 이 작업의 GITHUB_TOKEN으로 된다
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      prefix: ${{ steps.meta.outputs.prefix }}
    steps:
      # CI가 검사한 바로 그 커밋을 받는다. 그사이 main에 새 커밋이 들어왔어도 섞이지 않는다
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # 이미지 이름. GHCR은 소문자만 받는다
      - id: meta
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "prefix=ghcr.io/${owner}/bandal" >> "$GITHUB_OUTPUT"
          echo "tag=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"

      # x86 러너에서 Arm 이미지를 만든다. 무거운 빌드 단계는 Dockerfile이 러너의 CPU로 돌리고, 흉내 내는 건 마지막 단계뿐이다
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 층 캐시를 GitHub Actions 캐시에 둔다. 의존성이 그대로면 Gradle과 npm이 다시 받지 않는다
      - uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.prefix }}-backend:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - uses: docker/build-push-action@v6
        with:
          context: frontend
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.prefix }}-web:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  deploy:
    needs: images
    runs-on: ubuntu-24.04
    # Settings > Environments의 production. 비밀값을 이 환경에만 두면 다른 워크플로가 꺼내 쓸 수 없다
    environment: production
    permissions:
      contents: read
    env:
      HOST: ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}
    steps:
      # 값이 빠졌으면 조용히 건너뛰지 않고 무엇이 없는지 말하고 실패한다.
      # job의 if에서는 이 검사를 못 한다. if는 환경(production)이 정해지기 전에 계산돼서 환경 변수가 보이지 않는다
      - name: 배포 값 확인
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          MAIL_HOST: ${{ vars.MAIL_HOST }}
          MAIL_PORT: ${{ vars.MAIL_PORT }}
          MAIL_USERNAME: ${{ vars.MAIL_USERNAME }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          missing=0
          for n in DEPLOY_HOST DEPLOY_USER APP_BASE_URL R2_ENDPOINT R2_BUCKET MAIL_HOST MAIL_PORT MAIL_USERNAME MAIL_FROM ALERT_EMAIL \
                   DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS \
                   DB_PASSWORD JWT_SECRET MAIL_PASSWORD R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY; do
            if [ -z "${!n}" ]; then echo "::error::production 환경에 $n 이 없다"; missing=1; fi
          done
          exit $missing

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # 처음 보는 서버에는 접속하지 않는다. 서버의 호스트 키를 미리 Secrets에 넣어 두고 그것과 같은지 본다
      - name: SSH 준비
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: compose 파일과 배포, 백업, DLT 다시 넣기, 묶음 작업, 시연 데이터 스크립트 올리기
        run: tar -C deploy/bandal -cz compose.yml deploy.sh backup.sh restore.sh dlt-replay.sh grafana-reader.sh batch.sh demo-seed.sh demo-seed.sql | ssh "$HOST" 'mkdir -p /srv/bandal && tar -xz -C /srv/bandal'

      # .env는 배포마다 새로 쓴다. 비밀값을 Secrets에서 바꾸면 다음 배포부터 들어간다. 다른 사용자는 읽지 못하게 600으로
      - name: .env 쓰기
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          BACKUP_PING_URL: ${{ secrets.BACKUP_PING_URL }}
          BATCH_PING_URL: ${{ secrets.BATCH_PING_URL }}
        run: |
          {
            echo "IMAGE_PREFIX=${{ needs.images.outputs.prefix }}"
            echo "DB_USERNAME=bandal"
            echo "DB_PASSWORD=${DB_PASSWORD}"
            echo "JWT_SECRET=${JWT_SECRET}"
            echo "MAIL_HOST=${{ vars.MAIL_HOST }}"
            echo "MAIL_PORT=${{ vars.MAIL_PORT }}"
            echo "MAIL_USERNAME=${{ vars.MAIL_USERNAME }}"
            echo "MAIL_PASSWORD=${MAIL_PASSWORD}"
            echo "MAIL_FROM=${{ vars.MAIL_FROM }}"
            echo "APP_BASE_URL=${{ vars.APP_BASE_URL }}"
            # 아래는 앱이 아니라 backup.sh가 읽는다
            echo "R2_ENDPOINT=${{ vars.R2_ENDPOINT }}"
            echo "R2_BUCKET=${{ vars.R2_BUCKET }}"
            echo "R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}"
            echo "R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}"
            echo "BACKUP_PING_URL=${BACKUP_PING_URL}"
            # batch.sh가 읽는다
            echo "BATCH_PING_URL=${BATCH_PING_URL}"
          } | ssh "$HOST" 'umask 077 && cat > /srv/bandal/.env'

      # 새 버전이 healthy가 안 되면 스크립트가 이전 버전으로 되돌리고 실패로 끝난다
      - name: 배포
        run: ssh "$HOST" "bash /srv/bandal/deploy.sh ${{ needs.images.outputs.tag }}"

      # 앱 배포가 끝난 뒤에 띄운다. 관측이 실패해도 앱은 이미 새 버전이고, 이 단계만 빨간불이 된다
      - name: 관측 묶음(Prometheus, Grafana) 올리고 띄우기
        env:
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
        run: |
          tar -C deploy/monitoring -cz . | ssh "$HOST" 'tar -xz -C /srv/monitoring'
          # Grafana 경고 메일. 가입 메일과 같은 Resend SMTP로 보내고, 받는 주소는 운영자 메일(vars.ALERT_EMAIL)이다
          # .env처럼 배포마다 새로 쓴다. Grafana는 GF_로 시작하는 환경 변수를 설정으로 읽는다
          {
            echo "GF_SMTP_ENABLED=true"
            echo "GF_SMTP_HOST=${{ vars.MAIL_HOST }}:${{ vars.MAIL_PORT }}"
            echo "GF_SMTP_USER=${{ vars.MAIL_USERNAME }}"
            echo "GF_SMTP_PASSWORD=${MAIL_PASSWORD}"
            echo "GF_SMTP_FROM_ADDRESS=${{ vars.MAIL_FROM }}"
            echo "GF_SMTP_FROM_NAME=Bandal 경고"
            # 경고 연락처(provisioning/alerting/alerting.yml)가 이 값을 읽는다
            echo "ALERT_EMAIL=${{ vars.ALERT_EMAIL }}"
          } | ssh "$HOST" 'mkdir -p /srv/monitoring && umask 077 && cat > /srv/monitoring/.env.alerting'
          ssh "$HOST" 'bash /srv/monitoring/up.sh'
